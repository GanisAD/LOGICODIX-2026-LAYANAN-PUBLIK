# Vhost nginx host untuk siperiksa.app.launchify.site.
# Container hanya listen di 127.0.0.1:8080; TLS diterminasi di sini.
#
# Aktifkan di VPS:
#   sudo ln -sf ~/siperiksa/deploy/nginx/siperiksa.conf /etc/nginx/sites-enabled/siperiksa.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat dikelola Certbot (certbot renew tidak terpengaruh file ini).

server {
    listen 80;
    listen [::]:80;
    server_name siperiksa.app.launchify.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name siperiksa.app.launchify.site;

    ssl_certificate /etc/letsencrypt/live/siperiksa.app.launchify.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siperiksa.app.launchify.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
